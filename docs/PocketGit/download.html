<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>下載 PocketGit</title>

  <meta
    name="description"
    content="下載 PocketGit，直接前往 App Store。"
  />

  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f5f7;
      --card-background: rgba(255, 255, 255, 0.92);
      --primary-text: #1d1d1f;
      --secondary-text: #6e6e73;
      --button-background: #0071e3;
      --button-hover: #0077ed;
      --button-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --notice-background: #fff8e6;
      --notice-text: #7a5600;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #000000;
        --card-background: rgba(28, 28, 30, 0.92);
        --primary-text: #f5f5f7;
        --secondary-text: #a1a1a6;
        --button-background: #0a84ff;
        --button-hover: #409cff;
        --button-text: #ffffff;
        --border-color: rgba(255, 255, 255, 0.12);
        --notice-background: #332900;
        --notice-text: #ffd666;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          rgba(0, 113, 227, 0.15),
          transparent 38%
        ),
        var(--background);
      color: var(--primary-text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      padding: 36px 28px 28px;
      border: 1px solid var(--border-color);
      border-radius: 28px;
      background: var(--card-background);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.12),
        0 4px 16px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      text-align: center;
    }

    .app-icon {
      width: 104px;
      height: 104px;
      margin: 0 auto 22px;
      border-radius: 24px;
      object-fit: cover;
      display: block;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .app-icon-placeholder {
      width: 104px;
      height: 104px;
      margin: 0 auto 22px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(145deg, #2f80ed, #6c5ce7);
      color: white;
      font-size: 42px;
      font-weight: 700;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.18),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.18;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 10px 0 26px;
      color: var(--secondary-text);
      font-size: 16px;
      line-height: 1.6;
    }

    .download-button {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      border: 0;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--button-background);
      color: var(--button-text);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.16s ease,
        background-color 0.16s ease,
        opacity 0.16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .download-button:hover {
      background: var(--button-hover);
    }

    .download-button:active {
      transform: scale(0.98);
    }

    .download-button svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .notice {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--notice-background);
      color: var(--notice-text);
      font-size: 14px;
      line-height: 1.55;
      text-align: left;
    }

    .notice strong {
      font-weight: 700;
    }

    .manual-link {
      margin-top: 18px;
      font-size: 14px;
      color: var(--secondary-text);
      line-height: 1.6;
      word-break: break-word;
    }

    .manual-link a {
      color: var(--button-background);
      text-decoration: none;
      font-weight: 600;
    }

    .footer {
      margin-top: 18px;
      color: var(--secondary-text);
      font-size: 12px;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <!--
        有正式 App Icon 時，把下面這個 placeholder 刪掉，
        並取消 img 標籤的註解。
      -->

      <div class="app-icon-placeholder" aria-label="PocketGit App Icon">
        PG
      </div>

      <!--
      <img
        class="app-icon"
        src="./app-icon.png"
        alt="PocketGit App Icon"
      />
      -->

      <h1>下載 PocketGit</h1>

      <p class="subtitle">
        在 iPhone 或 iPad 上使用 PocketGit，
        點擊下方按鈕前往 App Store。
      </p>

      <a
        id="appStoreButton"
        class="download-button"
        href="https://apps.apple.com/tw/app/pocketgit/id6778365639"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M16.365 1.43c0 1.14-.42 2.19-1.13 2.99-.75.85-1.98 1.5-3.04 1.42-.13-1.09.39-2.24 1.09-2.96.77-.79 2.06-1.36 3.08-1.45ZM20.17 17.14c-.57 1.31-.84 1.9-1.58 3.06-1.03 1.63-2.49 3.66-4.29 3.68-1.6.02-2.02-1.07-4.19-1.05-2.17.01-2.63 1.08-4.23 1.05-1.81-.02-3.19-1.85-4.22-3.48-2.89-4.57-3.19-9.94-1.41-12.79 1.27-2.03 3.28-3.22 5.18-3.22 1.93 0 3.14 1.09 4.73 1.09 1.54 0 2.48-1.1 4.71-1.1 1.68 0 3.46.91 4.73 2.48-4.15 2.28-3.47 8.2.57 10.28Z"
          />
        </svg>

        在 App Store 下載
      </a>

      <div id="instagramNotice" class="notice hidden">
        <strong>Instagram 內開啟後顯示白畫面？</strong><br />
        請點右上角的「⋯」，選擇「在 Safari 開啟」，
        再點一次下載按鈕。
      </div>

      <div class="manual-link">
        無法自動開啟時，可
        <a
          href="https://apps.apple.com/tw/app/pocketgit/id6778365639"
          target="_blank"
          rel="noopener noreferrer"
        >
          直接開啟 App Store 頁面
        </a>
      </div>
    </section>

    <div class="footer">
      © 2026 PocketGit
    </div>
  </main>

  <script>
    const APP_STORE_URL =
      "https://apps.apple.com/tw/app/pocketgit/id6778365639";

    const appStoreButton =
      document.getElementById("appStoreButton");

    const instagramNotice =
      document.getElementById("instagramNotice");

    const userAgent =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera;

    const isInstagram =
      /Instagram/i.test(userAgent);

    appStoreButton.href = APP_STORE_URL;

    document
      .querySelectorAll('a[href*="apps.apple.com"]')
      .forEach((link) => {
        link.href = APP_STORE_URL;
      });

    if (isInstagram) {
      instagramNotice.classList.remove("hidden");
    }

    appStoreButton.addEventListener("click", () => {
      window.location.href = APP_STORE_URL;
    });
  </script>
</body>
</html>
